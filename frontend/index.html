<!DOCTYPE html>
<html>
<head>
    <title>Mera Cloud Uploader</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        .box { border: 2px dashed #0073bb; padding: 3px; width: 300px; margin: 0 auto; background: white; border-radius: 10px; }
        button { background-color: #0073bb; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>☁️ AWS Cloud Photo Uploader ☁️</h2>
    <p>Niche diye button se koi bhi photo select karein:</p>

    <div class="box">
        <input type="file" id="myFileButton" accept="image/*" /><br/><br/>
        
        <button onclick="uploadToCloud()">Upload to AWS</button>
    </div>

    <script>
        async function uploadToCloud() {
            // A. Pata lagao ki user ne kaunsi file select ki hai
            const fileInput = document.getElementById('myFileButton');
            const file = fileInput.files[0];
            
            if (!file) {
                alert("Pehle koi photo toh select karo bachhe! 😃");
                return;
            }

            // API Gateway Endpoint (Local Server / Simulator)
            const webAPI = window.location.origin.startsWith('http') ? '/upload' : 'http://localhost:3000/upload'; 

            const statusEl = document.getElementById('statusMsg');
            if (statusEl) {
                statusEl.innerText = "⏳ Photo process ho rahi hai aur S3 me bheji ja rahi hai...";
                statusEl.style.color = "#0073bb";
            }

            // C. Photo ko Base64 me badal kar API Gateway ko bhejna
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onloadend = async () => {
                try {
                    const base64Photo = reader.result.split(',')[1];
                    
                    const response = await fetch(webAPI, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name, data: base64Photo })
                    });
                    
                    const result = await response.json();
                    
                    if (response.ok) {
                        if (statusEl) {
                            statusEl.innerHTML = "✅ <b>Mubarak ho!</b> Photo S3 me pahunch gayi, Lambda trigger ho gaya, DynamoDB me save ho gaya aur SNS Email chali gayi! 🎉";
                            statusEl.style.color = "#16a34a";
                        } else {
                            alert('Mubarak ho! Photo AWS S3 me pahunch gayi aur Lambda chal gaya! 🎉');
                        }
                    } else {
                        throw new Error(result.error || 'Upload failed');
                    }
                } catch (err) {
                    if (statusEl) {
                        statusEl.innerText = "❌ Error: " + err.message + " (Kya local server chal raha hai?)";
                        statusEl.style.color = "#dc2626";
                    } else {
                        alert("Error: " + err.message);
                    }
                }
            };
        }
    </script>
    <div id="statusMsg" style="margin-top: 20px; font-weight: 500;"></div>
    <div style="margin-top: 30px;">
        <a href="/dashboard" target="_blank" style="color: #0073bb; text-decoration: none; font-weight: bold; border: 1px solid #0073bb; padding: 8px 16px; border-radius: 6px;">📊 Open Live Cloud Architecture Monitor</a>
    </div>

</body>
</html>
